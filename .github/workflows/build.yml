name: Lock.ai build checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: ESPN data source probe (non-blocking)
        continue-on-error: true
        run: npx tsx scripts/espnProbe.ts
      - name: ESPN player prop data probe (non-blocking)
        continue-on-error: true
        run: npx tsx scripts/playerProbe.ts
      - name: NFL gamelog shape probe (non-blocking)
        continue-on-error: true
        run: npx tsx scripts/nflShape.ts
      - name: Build frontend and server
        run: npm run build
      - name: Start built server and smoke-test API
        run: |
          NODE_ENV=production npm start > /tmp/lockai-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/season-status > /tmp/season-status.json 2>/dev/null; then
              node -e "const s=require('/tmp/season-status.json'); if(!s.NBA || !s.NFL) process.exit(1); console.log('NBA/NFL season endpoint OK')"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lockai-server.log
          exit 1
